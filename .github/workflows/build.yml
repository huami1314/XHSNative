name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      THEOS: ${{ github.workspace }}/.toolchain/theos
      THEOS_REV: 958fea4f779943505b15b93c88bb4db8d97b346d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Theos
        id: theos
        uses: actions/cache@v4
        with:
          path: .toolchain/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_REV }}

      - name: Get Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: ${{ env.THEOS_REV }}
          path: .toolchain/theos
          submodules: recursive
          persist-credentials: false

      - name: Build dylib
        run: |
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version"
          grep -Eq '^Xcode 27([.]|$)' "$RUNNER_TEMP/xcode-version"
          make -j"$(sysctl -n hw.ncpu)" TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS="-s -"
          xcrun lipo packages/XHSNative-*.dylib -verify_arch arm64

      - name: Build deb
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg
          for scheme in rootless roothide; do
            rm -rf .theos
            make package -j"$(sysctl -n hw.ncpu)" FINALPACKAGE=1 SCHEME=$scheme TARGET_CODESIGN=codesign TARGET_CODESIGN_FLAGS="-s -"
          done
          ls packages/*.deb
          test "$(ls packages/*.deb | wc -l)" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: XHSNative
          path: |
            packages/XHSNative-*.dylib
            packages/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: XHSNative

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          file="XHSNative-${TAG#v}.dylib"
          test -f "$file"
          debs=(*.deb)
          test "${#debs[@]}" -eq 2
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="${TAG#v}" '
            /^## / { active = ($2 == version); next }
            active && NF {
              if (!found++) print "## 更新日志\n"
              print
            }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" "${debs[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$file" "${debs[@]}" --verify-tag --title "$TAG" --notes-file "$notes"
          fi
